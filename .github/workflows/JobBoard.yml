name: CI/CD — TalentLayer Job Board

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install HTML validator
        run: npm install -g html-validate

      - name: Validate HTML
        run: html-validate index.html --config '{"extends":["html-validate:recommended"],"rules":{"require-sri":0,"no-inline-style":0}}'
        continue-on-error: true

      - name: Check file sizes
        run: |
          echo "📦 File size report:"
          find . -name "*.html" -o -name "*.css" -o -name "*.js" | grep -v node_modules | while read f; do
            size=$(wc -c < "$f")
            echo "  $f → ${size} bytes"
          done

      - name: Verify required files exist
        run: |
          echo "🔍 Checking required files..."
          files=("index.html" "vercel.json" "README.md")
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              echo "  ✅ $f exists"
            else
              echo "  ❌ $f missing"
              exit 1
            fi
          done

  # ─── DEPLOY TO VERCEL (Production) ──────────────────────────────────────────
  - name: Deploy to Vercel
  run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
  env:
    VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  # ─── DEPLOY PREVIEW (PRs) ───────────────────────────────────────────────────
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview to Vercel
        id: preview
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "🔍 Preview deployed to: $url"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔍 Preview Deployment\n\n**Preview URL:** ${url}\n\n| Check | Status |\n|-------|--------|\n| HTML Validation | ✅ Passed |\n| File Check | ✅ Passed |\n| Deployment | ✅ Live |\n\n_Preview auto-expires when PR is closed._`
            });
