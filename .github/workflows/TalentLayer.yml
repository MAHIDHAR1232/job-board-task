name: CI/CD — TalentLayer Job Board

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HTML validator
        run: npm install -g html-validate

      - name: Validate HTML
        run: html-validate index.html --config '{"extends":["html-validate:recommended"],"rules":{"require-sri":0,"no-inline-style":0}}'
        continue-on-error: true

      - name: Check file sizes
        run: |
          echo "📦 File size report:"
          find . -name "*.html" -o -name "*.css" -o -name "*.js" | grep -v node_modules | while read f; do
            size=$(wc -c < "$f")
            echo "  $f → ${size} bytes"
          done

      - name: Verify required files exist
        run: |
          echo "🔍 Checking required files..."
          files=("index.html" "vercel.json" "README.md")
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              echo "  ✅ $f exists"
            else
              echo "  ❌ $f missing"
              exit 1
            fi
          done
